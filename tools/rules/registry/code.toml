# Rules on Python source, and the ratchet on measured debt.

# What pre-commit calls: the staged blobs, on the commit's own index.
[check.source-rules-staged]
run = ["{py}", "tools/check_source_rules.py", "--staged"]
trigger = ["lucid/**", "tools/**"]

[check.source-rules]
run = ["{py}", "tools/check_source_rules.py", "{changed}"]
trigger = ["lucid/**", "tools/**"]

[check.test-h1]
kind = "pytest"
nodes = ["lucid/test/unit/test_source_rules.py::test_h1_no_future_annotations_import"]
trigger = ["lucid/**", "tools/**"]

[check.test-h5]
kind = "pytest"
nodes = [
    "lucid/test/unit/test_source_rules.py::test_h5_only_the_fixture_imports_the_reference_framework",
    "lucid/test/unit/test_source_rules.py::test_h5_the_reference_framework_is_named_in_one_file",
]
trigger = ["lucid/**", "tools/**"]

[check.test-h7]
kind = "pytest"
nodes = ["lucid/test/unit/test_source_rules.py::test_h7_no_annotation_is_a_string"]
trigger = ["lucid/**", "tools/**"]

# Goes red if the whole-tree read comes back empty, which would leave test-h1, test-h5
# and test-h7 passing on nothing.
[check.test-source-tree]
kind = "pytest"
nodes = ["lucid/test/unit/test_source_rules.py::test_every_excuse_is_still_needed"]
trigger = ["lucid/**", "tools/**"]

# {since} is HEAD at commit and the range's base otherwise: --fast alone measures only
# what differs from HEAD, so a range already committed would pass on nothing.
[check.quality-gate]
run = ["{py}", "-m", "tools.quality_gate", "--fast", "--since", "{since}"]
trigger = ["lucid/**", "tools/quality_gate/**", "tools/quality_baseline.json"]

# A rise only: a baseline left high is commit's question, and --update --fast could not
# answer it here, with nothing changed since HEAD.
[check.quality-gate-range]
run = ["{py}", "-m", "tools.quality_gate", "--fast", "--since", "{since}", "--allow-slack"]
trigger = ["lucid/**", "tools/quality_gate/**", "tools/quality_baseline.json"]

[check.quality-gate-full]
run = ["{py}", "-m", "tools.quality_gate", "--full", "--allow-slack"]
trigger = ["lucid/**", "tools/quality_gate/**", "tools/quality_baseline.json"]

# web/scripts/{build-api-data,build-cpp-data,build-usedby}.py hold the import: outside this scope.
[[rule]]
id = "H1"
statement = "No `from __future__ import annotations`."
why = "Python 3.14 evaluates annotations lazily (PEP 649); the import turns them back into strings."
scope = ["lucid/**", "tools/**"]
doc = "python"
enforce = [
    { level = "commit", check = "source-rules-staged" },
    { level = "push", check = "source-rules" },
    { level = "test", check = "test-h1" },
    { level = "test", check = "test-source-tree" },
]

[[rule.control]]
kind = "seed"
check = ["source-rules-staged", "source-rules"]
tree = ["lucid/test/_fixtures/ref_framework.py"]
path = "lucid/nn/_seed.py"
clean = "from __future__ import division\n"
text = "from __future__ import annotations\n"
expect = '\[future-annotations\]'

[[rule.control]]
kind = "pytest"
check = ["test-h1"]
nodes = [
    "lucid/test/unit/test_source_rules.py::test_each_rule_reports_its_violation[future-annotations]",
    "lucid/test/unit/test_source_rules.py::test_tools_are_held_to_h1_only",
]

[[rule.control]]
kind = "pytest"
check = ["test-source-tree"]
nodes = ["lucid/test/unit/test_source_rules.py::test_a_dead_path_in_prose_is_reported"]

[[rule]]
id = "H5"
statement = """
The reference framework's name appears in no source, comment, docstring or message outside
lucid/test/_fixtures/ref_framework.py; other tests take the `ref` fixture."""
why = "Lucid stands on its own; a named dependency in its source is one a user can trip over."
scope = ["lucid/**"]
doc = "python"
enforce = [
    { level = "commit", check = "source-rules-staged" },
    { level = "push", check = "source-rules" },
    { level = "test", check = "test-h5" },
    { level = "test", check = "test-source-tree" },
]

[[rule.control]]
kind = "seed"
check = ["source-rules-staged", "source-rules"]
tree = ["lucid/test/_fixtures/ref_framework.py"]
path = "lucid/nn/_seed.py"
clean = "import math\n"
text = ["import to", "rch\n"]  # in parts: this file is held to the rule it seeds
expect = '\[ref-import\]'

[[rule.control]]
kind = "seed"
check = ["source-rules-staged", "source-rules"]
tree = ["lucid/test/_fixtures/ref_framework.py"]
path = "lucid/nn/_seed.py"
clean = "# rounds as the reference framework does\n"
text = ["# rounds as To", "rch does\n"]
expect = '\[ref-name\]'

[[rule.control]]
kind = "pytest"
check = ["test-h5"]
nodes = [
    "lucid/test/unit/test_source_rules.py::test_each_rule_reports_its_violation[ref-import0]",
    "lucid/test/unit/test_source_rules.py::test_each_rule_reports_its_violation[ref-import1]",
    "lucid/test/unit/test_source_rules.py::test_each_rule_reports_its_violation[ref-import2]",
    "lucid/test/unit/test_source_rules.py::test_each_rule_reports_its_violation[ref-import3]",
    "lucid/test/unit/test_source_rules.py::test_each_rule_reports_its_violation[ref-import4]",
    "lucid/test/unit/test_source_rules.py::test_each_rule_reports_its_violation[ref-import5]",
    "lucid/test/unit/test_source_rules.py::test_each_rule_reports_its_violation[ref-name]",
]

[[rule.control]]
kind = "pytest"
check = ["test-source-tree"]
nodes = ["lucid/test/unit/test_source_rules.py::test_a_dead_path_in_prose_is_reported"]

[[rule]]
id = "H7"
statement = "No string annotations; a name used only for typing goes under TYPE_CHECKING."
why = "PEP 649 makes the quotes unnecessary, and a string hides the name from every checker."
scope = ["lucid/**"]
doc = "python"
enforce = [
    { level = "commit", check = "source-rules-staged" },
    { level = "push", check = "source-rules" },
    { level = "test", check = "test-h7" },
    { level = "test", check = "test-source-tree" },
]

[[rule.control]]
kind = "seed"
check = ["source-rules-staged", "source-rules"]
tree = ["lucid/test/_fixtures/ref_framework.py"]
path = "lucid/nn/_seed.py"
clean = "x: Annotated[int, 'metadata'] = 1\n"
text = "def f(x: 'Tensor') -> None: ...\n"
expect = '\[string-annotation\]'

[[rule.control]]
kind = "pytest"
check = ["test-h7"]
nodes = [
    "lucid/test/unit/test_source_rules.py::test_each_rule_reports_its_violation[string-annotation]",
]

[[rule.control]]
kind = "pytest"
check = ["test-source-tree"]
nodes = ["lucid/test/unit/test_source_rules.py::test_a_dead_path_in_prose_is_reported"]

[[rule]]
id = "S22"
statement = "Measured debt cannot rise."
why = "Debt that can rise unnoticed always does; the ratchet holds it to what is recorded."
scope = ["lucid/**"]
doc = "global"
enforce = [
    { level = "commit", check = "quality-gate" },
    { level = "push", check = "quality-gate-range" },
    { level = "ci", check = "quality-gate-full" },
]

# One seed for each collector --fast must not lose: ruff, counters, lizard.  Each trips
# only that one, so taking a collector away turns its case green.  Nothing else runs these.
[[rule.control]]
kind = "pytest"
check = ["quality-gate"]
nodes = [
    "tools/test_quality_gate.py::test_fast_check_fails_on_seeded_slop[except-pass]",
    "tools/test_quality_gate.py::test_fast_check_fails_on_seeded_slop[type-ignore]",
    "tools/test_quality_gate.py::test_fast_check_fails_on_seeded_slop[long-single-statement]",
    "tools/test_rules.py::test_push_gate_since_sees_a_rise_already_committed",
]

[[rule.control]]
kind = "pytest"
check = ["quality-gate-range"]
nodes = [
    "tools/test_rules.py::test_push_gate_since_sees_a_rise_already_committed",
    "tools/test_rules.py::test_push_gate_since_sees_a_baseline_raised_with_the_count",
    # The gate itself: every push level rests on a violation refusing the push.
    "tools/test_rules.py::test_push_gate_judges_each_range_once_and_all_of_them",
    "tools/test_rules.py::test_push_gate_refuses_a_working_copy_that_is_not_what_leaves",
]

# CI calls --full; a seed through --fast would not show that mode can fail.
[[rule.control]]
kind = "pytest"
check = ["quality-gate-full"]
nodes = ["tools/test_quality_gate.py::test_mypy_counts_an_error_in_a_tools_module_lucid_imports"]
