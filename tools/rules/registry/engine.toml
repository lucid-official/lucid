# Rules on what the compute paths and the C++ engine may reach.

[check.numpy-h4]
run = ["{py}", "tools/check_numpy_h4.py"]
trigger = ["lucid/**/*.py", "tools/check_numpy_h4.py"]

[check.cpp-layers]
run = ["{py}", "tools/check_cpp_layers.py"]
trigger = ["lucid/_C/**", "tools/check_cpp_layers.py"]

[check.test-cpp-layers]
kind = "pytest"
nodes = ["lucid/test/unit/test_check_cpp_layers.py::test_real_engine_tree_passes"]
trigger = ["lucid/_C/**", "tools/check_cpp_layers.py"]

[[rule]]
id = "H4"
statement = """
No external library in lucid/ compute paths: the C++ engine and the standard library only,
through the bridges tools/check_numpy_h4.py lists."""
why = "A compute path that needs a package breaks the bare install and hides a second backend."
scope = ["lucid/**"]
doc = "python"
gap = "Numpy only: any other package passes, and tensor.py's method limit is left to review. LCD-841-B2 generalises it."
enforce = [
    { level = "commit", check = "numpy-h4" },
    { level = "push", check = "numpy-h4", pending = "LCD-841-R2" },
    { level = "ci", check = "numpy-h4" },
]

[[rule.control]]
kind = "seed"
check = "numpy-h4"
path = "lucid/_seed.py"
text = "import numpy\n"
expect = '_seed\.py:1:\d+\s+import numpy'

[[rule]]
id = "H13"
statement = "No `goto` in C++ or Objective-C++."
why = "RAII and an early return state the cleanup; a jump around it does not."
scope = ["lucid/_C/**"]
doc = "engine"
enforce = [
    { level = "commit", check = "cpp-layers", pending = "LCD-841-R2" },
    { level = "push", check = "cpp-layers", pending = "LCD-841-R2" },
    { level = "test", check = "test-cpp-layers" },
]
allowlist = { source = "tools.check_cpp_layers:_ALLOWLIST", ceiling = 23 }

# The whole engine, because the tool holds its real allowlist to the tree: a
# smaller one would read as every entry gone stale.
[[rule.control]]
kind = "seed"
check = "cpp-layers"
tree = ["lucid/_C"]
path = "lucid/_C/ops/_Seed.cpp"
text = "void f() { goto done; done: return; }\n"
expect = '_Seed\.cpp:1: \[goto\]'

[[rule.control]]
kind = "pytest"
check = "test-cpp-layers"
nodes = [
    "lucid/test/unit/test_check_cpp_layers.py::test_injected_violation_is_reported",
    "lucid/test/unit/test_check_cpp_layers.py::test_allowlist_ratchet_detects_stale_and_duplicate_entries",
]
