# Rules on what the compute paths and the C++ engine may reach.

[check.numpy-h4]
run = ["{py}", "tools/check_numpy_h4.py"]
trigger = ["lucid/**/*.py", "tools/check_numpy_h4.py"]

[check.test-mlx-instance]
kind = "pytest"
nodes = ["lucid/test/unit/test_mlx_instance_rule.py::test_only_interop_tests_load_the_mlx_package"]
trigger = ["lucid/**/*.py"]

[check.cpp-layers]
run = ["{py}", "tools/check_cpp_layers.py"]
trigger = ["lucid/_C/**", "tools/check_cpp_layers.py"]

[check.test-cpp-layers]
kind = "pytest"
nodes = ["lucid/test/unit/test_check_cpp_layers.py::test_real_engine_tree_passes"]
trigger = ["lucid/_C/**", "tools/check_cpp_layers.py"]

# Push only: a worker may not touch version.h, so a commit that moves the interface is
# right to leave the bump to whoever lands it.  {since} is the remote's tip.
[check.abi-bump]
run = ["{py}", "tools/check_abi_bump.py", "--since", "{since}"]
trigger = ["lucid/_C/**", "tools/check_abi_bump.py"]

# A lookup in the ledger, instant.  The suites run in `attest`, never from a hook.
[check.cpp-attested]
run = ["{py}", "-m", "tools.rules", "attest", "--verify"]
trigger = ["lucid/_C/**"]

# test_numpy_independence is not claimed: it is a behaviour smoke over a fixed list of calls,
# and no seed can show it would notice an import, so R5 should not bring it back as a level.
[[rule]]
id = "H4"
statement = """
No external library in lucid/ compute paths: the C++ engine and the standard library only,
through the six bridges."""
why = "A compute path that needs a package breaks the bare install and hides a second backend."
scope = ["lucid/**"]
doc = "python"
gap = """
numpy and mlx only: any other package passes. numpy-h4 sees import statements and .numpy() calls, \
so importlib.import_module("numpy") and __import__("numpy") pass (test-mlx-instance does see those \
forms, for mlx). tensor.py, optim/optimizer.py and optim/lbfgs.py are allowed per file with no \
method limit. The tool's SANCTIONED list is the real bridge list, and it adds \
compile/_optim/compiler.py to the six. The tool skips lucid/test and lucid/benchmarks although the \
scope says lucid/**. LCD-841-B2 generalises it."""
enforce = [
    { level = "commit", check = "numpy-h4" },
    { level = "push", check = "numpy-h4" },
    { level = "ci", check = "numpy-h4" },
    { level = "test", check = "test-mlx-instance" },
]
allowlist = { source = "tools.check_numpy_h4:SANCTIONED", ceiling = 8 }

[[rule.control]]
kind = "seed"
check = ["numpy-h4"]
path = "lucid/nn/_seed.py"
clean = "import math\n"
text = "import numpy\n"
expect = '_seed\.py:1:\d+\s+import numpy'

[[rule.control]]
kind = "pytest"
check = ["test-mlx-instance"]
nodes = [
    "lucid/test/unit/test_mlx_instance_rule.py::test_the_rule_fires_where_mlx_is_loaded_on_purpose",
    "lucid/test/unit/test_mlx_instance_rule.py::test_every_loading_form_is_seen",
]

[[rule]]
id = "H13"
statement = "No `goto` in C++ or Objective-C++."
why = "RAII and an early return state the cleanup; a jump around it does not."
scope = ["lucid/_C/**"]
doc = "engine"
enforce = [
    { level = "commit", check = "cpp-layers" },
    { level = "push", check = "cpp-layers" },
    { level = "test", check = "test-cpp-layers" },
]
# The tool's _ALLOWLIST is other rules' debt (E-LAYERS, R5). None of it may be a goto.
allowlist = { source = "tools.check_cpp_layers:_ALLOWLIST", match = "goto", ceiling = 0 }

# The whole engine, because the tool holds its real allowlist to the tree: a
# smaller one would read as every entry gone stale.
[[rule.control]]
kind = "seed"
check = ["cpp-layers"]
tree = ["lucid/_C"]
path = "lucid/_C/ops/_Seed.cpp"
clean = "void f() { /* goto */ }\n"
text = "void f() { goto done; done: return; }\n"
expect = '_Seed\.cpp:1: \[goto\]'

[[rule.control]]
kind = "seed"
check = ["cpp-layers"]
tree = ["lucid/_C"]
path = "lucid/_C/ops/_Seed.mm"
clean = "void f() { /* goto */ }\n"
text = "void f() { goto done; done: return; }\n"
expect = '_Seed\.mm:1: \[goto\]'

[[rule.control]]
kind = "pytest"
check = ["test-cpp-layers"]
nodes = [
    "lucid/test/unit/test_check_cpp_layers.py::test_injected_violation_is_reported",
    "lucid/test/unit/test_check_cpp_layers.py::test_allowlist_ratchet_detects_stale_and_duplicate_entries",
]

# 578247379 put five virtuals on Node at ABI 40 and reached main; ABI 41 and 42 came as
# follow-ups.  The backtest is in tools/README.md, "C++ at push".
[[rule]]
id = "E-ABI-BUMP"
statement = """
A range that moves the engine's binary interface raises LUCID_ABI_VERSION, or a commit at or
after each move says why it did not: `ABI: none (<reason>)`."""
why = "An engine built before the move imports cleanly and fails at its first call."
scope = ["lucid/_C/**"]
doc = "engine"
gap = """
It reads headers as text, not as a compiler does: members a macro declares are not seen, both \
sides of an #if count, and a function-pointer member reads as a function.  A new class that is \
not LUCID_API, an enumerator, a default argument and an inline body are no move.  Bindings and \
engine.pyi are compared by name, so an argument a binding gains passes, and so does a name a \
registry binds at run time unless engine.pyi was regenerated.  A reason is taken as written.  \
Push only: no CI level until LCD-841-B5."""
enforce = [{ level = "push", check = "abi-bump" }]

[[rule.control]]
kind = "pytest"
check = ["abi-bump"]
nodes = [
    "tools/test_rules.py::test_abi_bump_sees_each_way_the_interface_moves",
    "tools/test_rules.py::test_abi_bump_lets_through_what_moves_nothing",
    "tools/test_rules.py::test_abi_bump_takes_a_bump_anywhere_in_the_range",
    "tools/test_rules.py::test_abi_bump_takes_a_reason_not_a_habit",
    "tools/test_rules.py::test_abi_bump_reads_a_range_or_says_it_cannot",
]

# On 2026-11-04 C++ reached main with unit/compile never run, and CI cancelled the runs
# that would have.  The suites cannot run at push, so `attest` runs them where the engine
# is fresh, and the push gate only looks the C++ tree up.
[[rule]]
id = "E-VERIFY-CPP"
statement = """
C++ leaves for main only with a recorded pass of lucid/test/unit/compile and unit/cost on an
engine built from that tree: `python -m tools.rules attest` writes it."""
why = "C++ the suites never saw reached main, and CI cancelled the run that would have seen it."
scope = ["lucid/_C/**"]
doc = "engine"
gap = """
A record is trusted as written: a hand-made file in the ledger passes.  "Built from that tree" \
is tools/agent_ws.py's freshness rule (the ABI the engine reports, then a source digest or \
mtimes), which does not see a CMakeLists or vendored-library change alone.  Python that \
changes after the record does not void it.  The engine-dependent checks of design section 9 \
step 5 do not run in it yet.  Push only."""
enforce = [{ level = "push", check = "cpp-attested" }]

[[rule.control]]
kind = "pytest"
check = ["cpp-attested"]
nodes = [
    "tools/test_rules.py::test_attest_records_a_pass_that_push_then_finds",
    "tools/test_rules.py::test_attest_refuses_what_it_cannot_vouch_for",
    "tools/test_rules.py::test_attest_records_a_failure_and_push_refuses_it",
    "tools/test_rules.py::test_attest_a_record_that_does_not_read_is_none",
]
