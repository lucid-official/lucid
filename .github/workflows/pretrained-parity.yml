name: Pretrained parity

# The published checkpoints, run against the implementations they were
# converted from.
#
# The zoo's other checks stop short of this. ``check_weight_fit`` asks
# whether a checkpoint loads; the model parity suite asks whether the
# architecture matches, and transfers *random* weights to do it. Neither
# looks at the numbers actually shipped, so a conversion that transposed
# a kernel or mapped the wrong source produces a file that loads into the
# right shapes and answers with something else — silently, since nothing
# downstream has anything to compare against.
#
# Not an accuracy benchmark. No labels and no dataset are involved: it
# checks conversion, not training, and says nothing about whether a model
# reaches its paper's numbers.
#
# Kept out of the local gate on purpose. It downloads both sides of every
# checkpoint it compares — tens of gigabytes across the zoo — which is
# fine on a runner that is thrown away and is not fine on a laptop.

on:
  # Weekly rather than per-commit: conversions change when someone
  # re-uploads a checkpoint or edits a factory's source mapping, not when
  # ordinary code lands.
  schedule:
    - cron: "0 7 * * 2"
  workflow_dispatch:
    inputs:
      limit:
        description: "Compare at most this many (blank for all)"
        required: false
        type: string
  pull_request:
    paths:
      - "lucid/models/**/_weights.py"
      - "tools/check_pretrained_parity.py"
      - "tools/_darknet_release.py"
      - "tools/_network_retry.py"
      - ".github/pretrained-parity-constraints.txt"
      - ".github/workflows/pretrained-parity.yml"

# Read-only: the comparison step holds the job's token and runs code it
# downloads (the reference hub's entry points, every oracle package).
permissions:
  contents: read

concurrency:
  group: pretrained-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Published checkpoints vs their sources
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Enforce Apple Silicon runner
        run: |
          python - <<'PY'
          import platform

          system = platform.system()
          machine = platform.machine()
          if system != "Darwin" or machine != "arm64":
              raise SystemExit(f"Lucid CI supports macOS arm64 only, got {system}/{machine}")
          print(f"runner={system}/{machine}")
          PY

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: pretrained-parity-py3.14
          max-size: 600M

      - uses: ./.github/actions/pinned-mlx

      - name: Install Lucid
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel cmake ninja "pybind11>=3.0,<3.1"
          python -m pip install --no-build-isolation -e ".[test]"

      # Every reference family, because the zoo's sources are mixed:
      # resnet_18 came from the reference vision package, sk_resnet_18
      # from the zoo oracle, and BERT, GPT-2, RoFormer, CvT and CLIP from
      # transformers. Comparing a model against the wrong one shows every
      # weight differing and reads exactly like a defect.
      #
      # scipy: DETR's hub entry point and transformers' MaskFormer /
      # Mask2Former import its Hungarian matcher at load time.  Without it
      # all eight were "unreachable" every week from 2026-09-22, which is
      # what failed the job — never a numeric difference.
      #
      # Pinned to the last green run's versions (the constraints file says
      # why and how to move them): the stack used to float, so a red could
      # not be told from a changed reference.
      - name: Install the reference implementations
        run: python -m pip install -c .github/pretrained-parity-constraints.txt timm transformers scipy

      - name: Disk before
        run: df -h / | tail -1

      # --clean-downloads: a full run otherwise keeps both sides of every
      # checkpoint until it ends — 81 GB on 2026-09-13, leaving 13 GB of
      # the runner's 94 free. Each comparison now removes what it fetched.
      #
      # GITHUB_TOKEN: DETR's original is loaded through the reference hub at
      # a pinned commit, and the hub first lists the repository's branches
      # and tags through the GitHub API to confirm the commit is not a
      # fork's.  Unauthenticated, a shared runner's address hits the API's
      # rate limit, and the hub's retry then deletes an Authorization header
      # it never set — KeyError: 'Authorization' for both DETRs on
      # 2026-10-02.  The job's read-only token lifts the limit.
      - name: Compare published checkpoints against their sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m tools.check_pretrained_parity --clean-downloads \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      # Downloads are the cost here, and a run that quietly stopped
      # comparing would look the same as one that passed. The counts in
      # the tool's own summary are the check on that; this is the disk it
      # took to get them.
      - name: Disk after
        if: always()
        run: df -h / | tail -1
