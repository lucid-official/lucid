name: Docs api-data refresh

# ``web/public/api-data/`` is a committed build artifact derived from
# ``lucid/**``.  The pre-commit hook can regenerate it, but it used to be slow
# enough that in practice it was bypassed with ``LUCID_SKIP_API_DATA=1`` on
# every commit.
#
# The result: Python commits accumulate invisible drift, because the Docs
# workflow only triggers on ``web/**`` and never sees them.  Drift went
# unnoticed from 2026-07-06 to 2026-07-26 and then failed the deploy in 13s.
#
# This job removes the reliance on that discipline.  It is cheap on the common
# path: the drift check is pure stdlib content hashing and exits in seconds
# when nothing is stale.  Only a real drift pays for the rebuild.
#
# The rebuild itself is ~10 s of Griffe work (~1 min with the post-processors
# and the commit).  It was 26 minutes plus 25 minutes of interpreter shutdown
# until LCD-969: the builder asked Griffe for each page by path, and every such
# call re-parsed the whole ``lucid/`` tree and left a 0.2 GB cyclic copy behind
# (peak 6 GB for 46 pages, still climbing).  The nightly run then died on the
# runner ("lost communication", 2026-11-11, twice).  Hence the limits below:
# they do not budget the work, they turn a stall into a fast, named failure.

on:
  schedule:
    - cron: "0 18 * * *"   # 03:00 KST
  workflow_dispatch:

permissions:
  contents: write
  actions: write           # to dispatch Docs after pushing

concurrency:
  group: docs-api-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate api-data if the Lucid source has drifted
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # A pipe is block-buffered: the 2026-11-11 runs showed nothing for the 24
      # minutes before the runner was lost, so nobody could tell where it was.
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # build-api-data.py is pure static analysis — Griffe reads the source
      # tree, nothing imports Lucid.  That matters here: Lucid is an Apple
      # Silicon / MLX extension and cannot be built on this runner at all.
      # The version is the one in pyproject.toml's ``apidata`` group, so this
      # runner and a laptop build the committed tree with the same Griffe
      # (the unpinned install gave 2.4.1 here while the dev venv had 2.1.0).
      - name: Install Griffe
        run: pip install --group apidata

      # Content-hash comparison against the committed baseline.  Seconds, and
      # on most days it is the only step that runs.
      - name: Check for drift
        id: drift
        working-directory: web
        run: |
          if python3 scripts/build-api-data-cached.py --check; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "api-data is in sync — nothing to do"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      # The builder's own cost guards: Griffe parses lucid/ once per build, the
      # process ends when its last output is written, the page order does not
      # depend on the hash seed.  ~15 s, and only when a rebuild is coming — a
      # builder that regressed to the old per-page re-parse should fail here,
      # in seconds, not on minute 25 of the real build.
      - name: Test the builder
        if: steps.drift.outputs.stale == 'true'
        working-directory: web
        run: python3 scripts/test_build_api_data_perf.py

      # FORCE because the per-module fingerprints the cached wrapper would
      # otherwise use are file mtimes, which a fresh checkout makes all new;
      # with the rebuild at ~10 s a full one costs less than the logic that
      # would avoid it.  Each progress line carries elapsed time and peak
      # memory, so a run that dies shows how far it got and how big it was.
      - name: Regenerate api-data
        if: steps.drift.outputs.stale == 'true'
        working-directory: web
        timeout-minutes: 15
        env:
          FORCE_API_BUILD: "1"
        run: |
          free -m | sed -n '1,2p'
          python3 scripts/build-api-data-cached.py || {
            status=$?
            echo "::error::api-data regeneration failed (exit $status) - the progress lines above name the last page built and the peak memory; 137 means the builder was SIGKILLed, almost always by the out-of-memory killer"
            exit "$status"
          }

      # Post-processes (mirroring ``pnpm prebuild``, so the committed tree is
      # the full deployable artifact the Docs drift gate expects),
      # re-baselines the drift cache, commits and pushes.  A push refused
      # because main moved during the rebuild is carried onto the new tip,
      # with the pages its commits made stale rebuilt there, a bounded
      # number of times; past that it fails naming the stale slugs.
      - name: Post-process, commit and push
        if: steps.drift.outputs.stale == 'true'
        id: push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/ci_api_data_push.sh

      # A GITHUB_TOKEN push does not trigger other workflows, so the Docs
      # deploy would otherwise wait for the next human ``web/**`` push.
      - name: Dispatch the Docs deploy
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docs.yml --ref main
